<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Enquiry | Greenway Farms</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <header>
            <h1>Greenway Farms</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>

            <h2>Product Enquiry</h2>
            <p>Want to order in bulk, ask about availability, or check pricing? Fill in the form below.</p>

            <form action="#" method="post">

                <!-- Basic contact details -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <label for="product">Product of Interest:</label>
                <select id="product" name="product">
                    <option value="vegetables">Fresh Carrots</option>
                    <option value="fruit">Wheat</option>
                    <option value="eggs">Soya beans</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Enquiry</button>
            </form>

        </main>

        <footer>
            <p>&copy; 2026 Greenway Farms. All Rights Reserved.</p>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
